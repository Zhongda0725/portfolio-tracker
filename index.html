<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資產">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>資產追蹤器</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #191919;
  --surface2: #222;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0ede8;
  --muted: #888;
  --hint: #555;
  --green: #4caf82;
  --red: #e06c5a;
  --blue: #4a9eff;
  --gold: #d4a847;
  --r: 14px; --rs: 8px;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bot: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100dvh;overscroll-behavior:none}
.mono{font-family:'DM Mono',monospace}

/* ── SCREENS ── */
.screen{display:none;min-height:100dvh}
.screen.show{display:flex;flex-direction:column}

/* ── AUTH SCREEN ── */
#auth-screen{align-items:center;justify-content:center;padding:2rem 1.5rem;
  background:radial-gradient(ellipse at 30% 20%,rgba(74,158,255,.08) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(76,175,130,.06) 0%,transparent 60%)}
.auth-logo{width:72px;height:72px;background:var(--surface);border:0.5px solid var(--border2);
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:1.5rem;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.auth-title{font-size:24px;font-weight:500;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:2rem;max-width:280px}
.auth-card{width:100%;max-width:340px;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.25rem}
.auth-tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:3px;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:7px;font-size:13px;text-align:center;border:none;background:transparent;
  color:var(--muted);cursor:pointer;border-radius:6px;font-family:inherit;transition:all .15s}
.auth-tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--rs);
  border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit}
.field input:focus{outline:none;border-color:var(--blue)}
.primary-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s}
.primary-btn:active{opacity:.8}
.auth-err{font-size:12px;color:var(--red);margin-top:8px;text-align:center;min-height:18px}

/* ── APP ── */
#app-screen{flex-direction:column}
.statusbar-pad{height:calc(var(--safe-top) + 10px);flex-shrink:0}
.topnav{padding:0 1rem .75rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-title{font-size:17px;font-weight:500;letter-spacing:-.02em}
.nav-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;background:var(--surface);border:0.5px solid var(--border);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.icon-btn:active{background:var(--surface2)}
.user-avatar{width:30px;height:30px;background:var(--blue);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer}

.scroll{flex:1;overflow-y:auto;padding:0 1rem;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ── HERO ── */
.hero{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);
  padding:1.25rem;margin-bottom:10px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;
  border-radius:50%;background:radial-gradient(circle,rgba(74,158,255,.1) 0%,transparent 70%);pointer-events:none}
.hero-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.hero-total{font-size:34px;font-weight:300;letter-spacing:-.02em;font-family:'DM Mono',monospace;margin-bottom:12px}
.hero-row{display:flex;gap:12px}
.hero-stat{flex:1}
.hsl{font-size:10px;color:var(--muted);margin-bottom:2px}
.hsv{font-size:13px;font-family:'DM Mono',monospace;font-weight:500}
.hero-update{font-size:10px;color:var(--hint);margin-top:10px}

/* ── ALLOC ── */
.alloc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.alloc-pill{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:10px}
.alloc-emoji{font-size:14px;margin-bottom:3px}
.alloc-val{font-size:12px;font-weight:500;font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-pct{font-size:10px;color:var(--muted);margin-top:1px}

/* ── CHART ── */
.chart-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chart-title{font-size:13px;font-weight:500}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.leg-line{width:12px;height:2px;border-radius:1px}
.chart-wrap{position:relative;height:160px}
.chart-empty{height:120px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--hint);text-align:center;line-height:1.7}

/* ── TABS ── */
.tabs-wrap{margin-bottom:10px}
.tabs{display:flex;gap:2px;background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--rs);padding:3px}
.tab{flex:1;padding:8px 0;font-size:12px;text-align:center;border:none;
  background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;
  font-family:inherit;transition:all .15s}
.tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.panel{display:none}.panel.active{display:block}

/* ── SECTION ── */
.section{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px}
.section-title{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.add-note{font-size:11px;color:var(--hint);background:var(--surface2);border-radius:var(--rs);padding:8px 10px;margin-bottom:12px;line-height:1.6}

/* ── FORM ── */
.form-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ff label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ff input,.ff select{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--rs);
  border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit;-webkit-appearance:none}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--blue)}
.price-row{display:flex;gap:8px;align-items:flex-end}
.price-row .ff{flex:1}
.price-badge{font-size:11px;padding:4px 8px;border-radius:var(--rs);background:var(--surface2);
  color:var(--muted);white-space:nowrap;margin-bottom:0;align-self:flex-end;border:0.5px solid var(--border2)}
.price-badge.loaded{color:var(--green);border-color:rgba(76,175,130,.3)}
.add-btn{width:100%;padding:12px;background:var(--surface2);color:var(--text);
  border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;
  cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s}
.add-btn:active{background:var(--border2)}
.add-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── LIST ── */
.item-list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--border)}
.item:last-child{border-bottom:none}
.item-left{flex:1;min-width:0}
.item-ticker{display:inline-block;border-radius:5px;padding:2px 7px;font-size:12px;
  font-weight:500;font-family:'DM Mono',monospace;margin-bottom:2px}
.ts{background:rgba(74,158,255,.15);color:var(--blue)}
.tb{background:rgba(76,175,130,.15);color:var(--green)}
.tc{background:rgba(212,168,71,.15);color:var(--gold)}
.item-name{font-size:11px;color:var(--hint)}
.item-mid{text-align:right;margin:0 8px;min-width:80px}
.item-mv{font-size:14px;font-weight:500;font-family:'DM Mono',monospace}
.item-cost{font-size:10px;color:var(--hint)}
.item-right{text-align:right;min-width:50px}
.item-pnl{font-size:12px;font-family:'DM Mono',monospace;font-weight:500}
.item-sub{font-size:10px;color:var(--hint)}
.item-del{background:none;border:none;color:var(--hint);cursor:pointer;font-size:18px;padding:4px 6px;margin-left:2px}
.item-del:active{color:var(--red)}
.g{color:var(--green)}.r{color:var(--red)}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--hint);font-size:13px;line-height:1.8}

/* ── PRICE SEARCH INDICATOR ── */
.searching{display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── LOADING ── */
.loading-overlay{position:fixed;inset:0;background:rgba(15,15,15,.85);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;z-index:999;backdrop-filter:blur(4px)}
.loading-overlay.show{display:flex}
.spin{display:inline-block;animation:spin .7s linear infinite;font-size:24px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-bot) + 24px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--surface2);color:var(--text);border:0.5px solid var(--border2);
  border-radius:20px;padding:9px 18px;font-size:13px;opacity:0;
  transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BOTTOM PAD ── */
.bottom-pad{height:calc(var(--safe-bot) + 24px)}

/* ── GOOGLE BTN ── */
.auth-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--hint);font-size:11px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:0.5px;background:var(--border2)}
.google-btn{width:100%;padding:11px;background:transparent;color:var(--text);
  border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}
.google-btn:active{background:var(--surface2)}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="screen show" id="auth-screen">
  <div class="auth-logo">📊</div>
  <h1 class="auth-title">資產追蹤器</h1>
  <p class="auth-sub">追蹤股票、銀行帳戶、加密貨幣，每天自動更新收盤價</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">登入</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">註冊</button>
    </div>
    <div class="field">
      <label>Email</label>
      <input id="auth-email" type="email" placeholder="you@example.com" inputmode="email" autocomplete="email">
    </div>
    <div class="field">
      <label>密碼</label>
      <input id="auth-password" type="password" placeholder="至少 6 個字元" autocomplete="current-password">
    </div>
    <div class="field" id="confirm-field" style="display:none">
      <label>確認密碼</label>
      <input id="auth-confirm" type="password" placeholder="再輸入一次" autocomplete="new-password">
    </div>
    <button class="primary-btn" id="auth-btn" onclick="handleAuth()">登入</button>
    <div class="auth-divider">或</div>
    <button class="google-btn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.5 2.8 13.5l7.8 6C12.4 13 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.8 10.5l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.8 6C6.7 42.5 14.7 48 24 48z"/></svg>
      使用 Google 帳號繼續
    </button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="screen" id="app-screen">
  <div class="statusbar-pad"></div>
  <div class="topnav">
    <span class="app-title">資產追蹤器</span>
    <div class="nav-right">
      <div class="icon-btn" onclick="refreshAll()" title="更新報價">↻</div>
      <div class="user-avatar" id="user-avatar" onclick="handleLogout()" title="登出">?</div>
    </div>
  </div>

  <div class="scroll">
    <!-- HERO -->
    <div class="hero">
      <div class="hero-label">總資產市值</div>
      <div class="hero-total mono" id="hero-total">NT$0</div>
      <div class="hero-row">
        <div class="hero-stat"><div class="hsl">投入成本</div><div class="hsv mono" id="hero-cost">NT$0</div></div>
        <div class="hero-stat"><div class="hsl">未實現損益</div><div class="hsv mono" id="hero-pnl">—</div></div>
        <div class="hero-stat"><div class="hsl">增值佔比</div><div class="hsv mono" id="hero-growth">—</div></div>
      </div>
      <div class="hero-update" id="hero-update">—</div>
    </div>

    <!-- ALLOC -->
    <div class="alloc-row">
      <div class="alloc-pill"><div class="alloc-emoji">📈</div><div class="alloc-val mono" id="a-stock">—</div><div class="alloc-pct" id="ap-stock">股票</div></div>
      <div class="alloc-pill"><div class="alloc-emoji">🏦</div><div class="alloc-val mono" id="a-bank">—</div><div class="alloc-pct" id="ap-bank">銀行</div></div>
      <div class="alloc-pill"><div class="alloc-emoji">₿</div><div class="alloc-val mono" id="a-crypto">—</div><div class="alloc-pct" id="ap-crypto">加密</div></div>
    </div>

    <!-- CHART -->
    <div class="chart-card">
      <div class="chart-hdr">
        <span class="chart-title">資產走勢</span>
        <div class="legend">
          <div class="leg"><div class="leg-line" style="background:#4a9eff"></div>市值</div>
          <div class="leg"><div class="leg-line" style="background:#555;border-top:1.5px dashed #555;height:0"></div>成本</div>
        </div>
      </div>
      <div id="chart-empty" class="chart-empty">每天開啟 App 自動快照<br>累積幾天後顯示趨勢</div>
      <div id="chart-wrap" class="chart-wrap" style="display:none">
        <canvas id="trend-chart" role="img" aria-label="資產市值走勢圖"></canvas>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-wrap">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('stock')">📈 股票</button>
        <button class="tab" onclick="switchTab('bank')">🏦 銀行</button>
        <button class="tab" onclick="switchTab('crypto')">₿ 加密</button>
      </div>
    </div>

    <!-- STOCK -->
    <div class="panel active" id="panel-stock">
      <div class="section">
        <div class="section-title">新增台股持倉</div>
        <div class="form-fields">
          <div class="price-row">
            <div class="ff">
              <label>股票代號</label>
              <input id="s-ticker" placeholder="2330、0050" style="text-transform:uppercase" inputmode="text" oninput="onTickerInput(this)">
            </div>
            <div class="price-badge" id="s-price-badge">輸入代號查詢</div>
          </div>
          <div class="row2">
            <div class="ff"><label>持有股數</label><input id="s-shares" type="number" placeholder="100" inputmode="decimal"></div>
            <div class="ff"><label>平均成本 (元)</label><input id="s-cost" type="number" placeholder="750" inputmode="decimal"></div>
          </div>
        </div>
        <button class="add-btn" id="s-add-btn" onclick="addStock()">新增持倉 +</button>
      </div>
      <div class="section">
        <div class="section-title">持倉明細</div>
        <div class="item-list" id="stock-list"><div class="empty-state">尚未新增持倉</div></div>
      </div>
    </div>

    <!-- BANK -->
    <div class="panel" id="panel-bank">
      <div class="section">
        <div class="section-title">新增銀行帳戶</div>
        <div class="form-fields">
          <div class="ff"><label>帳戶名稱</label><input id="b-name" placeholder="玉山活存、富邦定存"></div>
          <div class="row2">
            <div class="ff"><label>幣別</label>
              <select id="b-currency">
                <option value="TWD">台幣 TWD</option>
                <option value="USD">美元 USD</option>
                <option value="JPY">日圓 JPY</option>
                <option value="EUR">歐元 EUR</option>
              </select>
            </div>
            <div class="ff"><label>餘額</label><input id="b-balance" type="number" placeholder="100000" inputmode="decimal"></div>
          </div>
        </div>
        <button class="add-btn" onclick="addBank()">新增帳戶 +</button>
      </div>
      <div class="section">
        <div class="section-title">帳戶明細 <span style="font-weight:300;font-size:10px;color:var(--hint);text-transform:none">點擊餘額更新</span></div>
        <div class="item-list" id="bank-list"><div class="empty-state">尚未新增帳戶</div></div>
      </div>
    </div>

    <!-- CRYPTO -->
    <div class="panel" id="panel-crypto">
      <div class="section">
        <div class="section-title">新增加密貨幣</div>
        <div class="form-fields">
          <div class="price-row">
            <div class="ff">
              <label>幣種代號</label>
              <input id="c-sym" placeholder="BTC、ETH、SOL" style="text-transform:uppercase" inputmode="text" oninput="onCryptoInput(this)">
            </div>
            <div class="price-badge" id="c-price-badge">輸入代號查詢</div>
          </div>
          <div class="row2">
            <div class="ff"><label>持有數量</label><input id="c-amount" type="number" placeholder="0.1" step="any" inputmode="decimal"></div>
            <div class="ff"><label>平均成本 (USD)</label><input id="c-cost" type="number" placeholder="60000" inputmode="decimal"></div>
          </div>
        </div>
        <button class="add-btn" id="c-add-btn" onclick="addCrypto()">新增加密貨幣 +</button>
      </div>
      <div class="section">
        <div class="section-title">持幣明細</div>
        <div class="item-list" id="crypto-list"><div class="empty-state">尚未新增加密貨幣</div></div>
      </div>
    </div>

    <div class="bottom-pad"></div>
  </div>
</div>

<div class="loading-overlay" id="loading"><span class="spin">↻</span><span class="loading-text" id="loading-text">載入中...</span></div>
<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, deleteDoc, query, orderBy, limit }

function fmtK(n){if(n==null||isNaN(n))return '—';if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1000)return (n/1000).toFixed(0)+'K';return fmt(n)}

function userDoc(path){ return doc(db, 'users', uid, ...path.split('/')); }

async function loadUserData() {
  showLoad('載入資料中...');

// ── PRICE FETCHING ───────────────────────────────────────────
async function fetchStockPrice(ticker) {
  const symbol = /^\d/.test(ticker) ? ticker+'.TW' : ticker;
  const proxy = 'https://api.allorigins.win/get?url=';
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
  try {
    const res = await fetch(proxy + encodeURIComponent(yahooUrl));
    const wrapper = await res.json();
    const json = JSON.parse(wrapper.contents);
    const price = json?.chart?.result?.[0]?.meta?.regularMarketPrice;
    return price ? parseFloat(price.toFixed(2)) : null;
  } catch(e) { return null; }
}

async function fetchCryptoPrice(sym) {
  const id = CRYPTO_ID[sym.toUpperCase()] || sym.toLowerCase();
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`);
    const json = await res.json();
    return json[id]?.usd || null;
  } catch(e) { return null; }
}

async function refreshPrices(silent=false) {
  if(!silent) showLoad('更新報價中...');
  const updates = [];

  // Update stocks
  for(const s of stocks) {
    const price = await fetchStockPrice(s.ticker);
    if(price) {
      s.currentPrice = price;
      updates.push(updateDoc(userDoc('stocks/'+s.id), {currentPrice:price, updatedAt:new Date().toISOString()}));
    }
  }

  // Update cryptos
  if(cryptos.length) {
    const syms = cryptos.map(c=>c.sym);
    const ids = syms.map(s=>CRYPTO_ID[s]||s.toLowerCase()).join(',');
    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
      const json = await res.json();
      cryptos.forEach(c => {
        const id = CRYPTO_ID[c.sym]||c.sym.toLowerCase();
        const price = json[id]?.usd;
        if(price) {
          c.currentPrice = price;
          updates.push(updateDoc(userDoc('cryptos/'+c.id), {currentPrice:price, updatedAt:new Date().toISOString()}));
        }
      });
    } catch(e) {}
  }

  await Promise.allSettled(updates);
  const now = new Date();
  document.getElementById('hero-update').textContent =
    '報價更新：' + now.getMonth()+1 + '/' + now.getDate() + ' ' +
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if(!silent) { hideLoad(); showToast('報價已更新'); renderAll(); }
}

// ── SNAPSHOT ─────────────────────────────────────────────────
async function maybeAutoSnapshot() {
  const today = new Date().toLocaleDateString('zh-TW');
  const existing = history.find(h=>h.date===today);
  if(existing) return;
  const t = calcTotals();
  if(t.totalMV === 0) return;
  const snap = {date:today, totalMV:t.totalMV, totalCost:t.totalCost,
    stockMV:t.stockMV, bankMV:t.bankMV, cryptoMV:t.cryptoMV,
    createdAt:new Date().toISOString()};
  try {
    const ref = await addDoc(userCol('history'), snap);
    history.push({id:ref.id,...snap});
    if(history.length>90) {
      const old = history.shift();
      await deleteDoc(userDoc('history/'+old.id));
    }
  } catch(e) {}
}

// ── CALC ─────────────────────────────────────────────────────
function calcTotals() {
  let stockMV=0,stockCost=0,bankMV=0,cryptoMV=0,cryptoCost=0;
  stocks.forEach(s=>{ stockMV+=(s.currentPrice||s.costPrice)*s.shares; stockCost+=s.costPrice*s.shares; });
  banks.forEach(b=>{ bankMV+=b.balance*(FX[b.currency]||1); });
  cryptos.forEach(c=>{ cryptoMV+=(c.currentPrice||c.costUSD)*c.amount*FX.USD; cryptoCost+=c.costUSD*c.amount*FX.USD; });
  return {stockMV,stockCost,bankMV,cryptoMV,cryptoCost,
    totalMV:stockMV+bankMV+cryptoMV, totalCost:stockCost+bankMV+cryptoCost};
}

  if(isNaN(n)||n<0){showToast('請輸入有效金額');return;}
  try {
    await updateDoc(userDoc('banks/'+id), {balance:n, updatedAt:new Date().toISOString()});
    const idx = banks.findIndex(b=>b.id===id);
    if(idx>=0) banks[idx].balance = n;
    renderAll(); showToast('餘額已更新');
  } catch(e){showToast('更新失敗');}
};

// ── DELETE ───────────────────────────────────────────────────
window.delStock = async (id) => {
  const s = stocks.find(x=>x.id===id);
  if(!confirm('確定刪除 '+(s?.ticker||'')+'？'))return;
  await deleteDoc(userDoc('stocks/'+id));
  stocks = stocks.filter(x=>x.id!==id);
  renderAll();
};
window.delBank = async (id) => {
  const b = banks.find(x=>x.id===id);
  if(!confirm('確定刪除 '+(b?.name||'')+'？'))return;
  await deleteDoc(userDoc('banks/'+id));
  banks = banks.filter(x=>x.id!==id);
  renderAll();
};
window.delCrypto = async (id) => {
  const c = cryptos.find(x=>x.id===id);
  if(!confirm('確定刪除 '+(c?.sym||'')+'？'))return;
  await deleteDoc(userDoc('cryptos/'+id));
  cryptos = cryptos.filter(x=>x.id!==id);
  renderAll();
};

// ── REFRESH & TAB ────────────────────────────────────────────
window.refreshAll = async () => { await refreshPrices(false); await maybeAutoSnapshot(); };
window.switchTab = (t) => {
  ['stock','bank','crypto'].forEach((s,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',s===t);
    document.getElementById('panel-'+s).classList.toggle('active',s===t);
  });
};

// ── PWA ──────────────────────────────────────────────────────
if(navigator.serviceWorker) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
