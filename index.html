<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="資產">
<meta name="theme-color" id="theme-color-meta" content="#f7f6f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>資產追蹤器</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── LIGHT (default) ── */
:root{
  --bg:#f7f6f2;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.13);
  --text:#1a1a18;--muted:#777;--hint:#bbb;
  --green:#1d9e6a;--red:#d04a30;--blue:#1a6fd4;--gold:#a07810;
  --shadow:0 1px 4px rgba(0,0,0,.06);
  --r:14px;--rs:8px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
/* ── DARK ── */
.dark{
  --bg:#0f0f0f;--surface:#191919;--surface2:#222;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#f0ede8;--muted:#888;--hint:#555;
  --green:#4caf82;--red:#e06c5a;--blue:#4a9eff;--gold:#d4a847;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100dvh;overscroll-behavior:none;transition:background .2s,color .2s}
.mono{font-family:'DM Mono',monospace}
.screen{display:none;min-height:100dvh}
.screen.show{display:flex;flex-direction:column}

/* ── AUTH ── */
#auth-screen{align-items:center;justify-content:center;padding:2rem 1.5rem;
  background:radial-gradient(ellipse at 30% 20%,rgba(26,111,212,.06) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(29,158,106,.05) 0%,transparent 60%)}
.dark #auth-screen{background:radial-gradient(ellipse at 30% 20%,rgba(74,158,255,.08) 0%,transparent 60%),
  radial-gradient(ellipse at 80% 80%,rgba(76,175,130,.06) 0%,transparent 60%)}
.auth-logo{width:72px;height:72px;background:var(--surface);border:0.5px solid var(--border2);border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.auth-title{font-size:24px;font-weight:500;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:2rem;max-width:280px}
.auth-card{width:100%;max-width:340px;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow)}
.auth-tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:3px;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:7px;font-size:13px;text-align:center;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-family:inherit;transition:all .15s}
.auth-tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--rs);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit}
.field input:focus{outline:none;border-color:var(--blue)}
.primary-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s}
.primary-btn:active{opacity:.8}
.auth-err{font-size:12px;color:var(--red);margin-top:8px;text-align:center;min-height:18px}
.auth-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--hint);font-size:11px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:0.5px;background:var(--border2)}
.google-btn{width:100%;padding:11px;background:transparent;color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}
.google-btn:active{background:var(--surface2)}

/* ── APP SHELL ── */
#app-screen{flex-direction:column}
.statusbar-pad{height:calc(var(--safe-top) + 10px);flex-shrink:0}
.topnav{padding:0 1rem .75rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-title{font-size:17px;font-weight:500;letter-spacing:-.02em}
.nav-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;background:var(--surface);border:0.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn:active{background:var(--surface2)}
.user-avatar{width:30px;height:30px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer;color:#fff}
.scroll{flex:1;overflow-y:auto;padding:0 1rem;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ── HERO ── */
.hero{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(26,111,212,.07) 0%,transparent 70%);pointer-events:none}
.dark .hero::before{background:radial-gradient(circle,rgba(74,158,255,.1) 0%,transparent 70%)}
.hero-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.hero-total{font-size:34px;font-weight:400;letter-spacing:-.01em;font-family:'Noto Sans TC',sans-serif;margin-bottom:12px}
.hero-row{display:flex;gap:12px}
.hero-stat{flex:1}
.hsl{font-size:10px;color:var(--muted);margin-bottom:2px}
.hsv{font-size:13px;font-family:'Noto Sans TC',sans-serif;font-weight:500}
.hero-update{font-size:10px;color:var(--hint);margin-top:10px}

/* ── ALLOC ── */
.alloc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.alloc-pill{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:10px;box-shadow:var(--shadow)}
.alloc-emoji{font-size:14px;margin-bottom:3px}
.alloc-val{font-size:12px;font-weight:500;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-pct{font-size:10px;color:var(--muted);margin-top:1px}

/* ── DONUT ── */
.donut-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px;box-shadow:var(--shadow)}
.donut-hdr{font-size:13px;font-weight:500;margin-bottom:12px}
.donut-body{display:flex;align-items:center;gap:16px}
.donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.donut-center-val{font-size:13px;font-weight:500;font-family:'Noto Sans TC',sans-serif;margin-top:1px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:8px}
.donut-leg{display:flex;align-items:center;gap:8px}
.donut-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.donut-leg-info{flex:1}
.donut-leg-name{font-size:12px;color:var(--text);font-weight:500}
.donut-leg-val{font-size:10px;color:var(--muted);font-family:'Noto Sans TC',sans-serif}
.donut-leg-pct{font-size:12px;font-family:'Noto Sans TC',sans-serif;color:var(--muted);margin-left:auto}

/* ── CHART ── */
.chart-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px;box-shadow:var(--shadow)}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chart-title{font-size:13px;font-weight:500}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.leg-line{width:12px;height:2px;border-radius:1px}
.chart-wrap{position:relative;height:160px}
.chart-empty{height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--hint);text-align:center;line-height:1.7}

/* ── TABS ── */
.tabs-wrap{margin-bottom:10px}
.tabs{display:flex;gap:2px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);padding:3px;box-shadow:var(--shadow)}
.tab{flex:1;padding:8px 0;font-size:12px;text-align:center;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;font-family:inherit;transition:all .15s}
.tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.panel{display:none}.panel.active{display:block}

/* ── SECTION ── */
.section{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px;box-shadow:var(--shadow)}
.section-title{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}

/* ── FORM ── */
.form-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ff label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ff input,.ff select{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--rs);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit;-webkit-appearance:none}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--blue)}
.price-row{display:flex;gap:8px;align-items:flex-end}
.price-row .ff{flex:1}
.price-badge{font-size:11px;padding:6px 8px;border-radius:var(--rs);background:var(--surface2);color:var(--muted);white-space:nowrap;align-self:flex-end;border:0.5px solid var(--border2)}
.price-badge.loaded{color:var(--green);border-color:rgba(29,158,106,.3)}
.dark .price-badge.loaded{border-color:rgba(76,175,130,.3)}
.add-btn{width:100%;padding:12px;background:var(--surface2);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s}
.add-btn:active{background:var(--border2)}
.add-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── ITEMS ── */
.item-list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--border)}
.item:last-child{border-bottom:none}
.item-left{flex:1;min-width:0}
.item-ticker{display:inline-block;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:500;font-family:'DM Mono',monospace;margin-bottom:2px}
.ts{background:rgba(26,111,212,.1);color:var(--blue)}
.tb{background:rgba(29,158,106,.1);color:var(--green)}
.tc{background:rgba(160,120,16,.1);color:var(--gold)}
.te{background:rgba(138,58,185,.1);color:#8a3ab9}
.dark .ts{background:rgba(74,158,255,.15)}.dark .tb{background:rgba(76,175,130,.15)}.dark .tc{background:rgba(212,168,71,.15)}
.dark .te{background:rgba(180,100,255,.15);color:#c47eff}
.item-name{font-size:11px;color:var(--hint)}
.item-mid{text-align:right;margin:0 6px;min-width:78px}
.item-mv{font-size:14px;font-weight:500;font-family:'Noto Sans TC',sans-serif}
.item-cost{font-size:10px;color:var(--hint)}
.item-right{text-align:right;min-width:48px}
.item-pnl{font-size:12px;font-family:'Noto Sans TC',sans-serif;font-weight:500}
.item-sub{font-size:10px;color:var(--hint)}
.item-actions{display:flex;gap:0;margin-left:4px}
.item-act-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px 5px;border-radius:4px;line-height:1}
.item-act-btn:active{background:var(--surface2);color:var(--blue)}
.item-del{background:none;border:none;color:var(--hint);cursor:pointer;font-size:18px;padding:4px 4px;border-radius:3px}
.item-del:active{color:var(--red)}
.g{color:var(--green)}.r{color:var(--red)}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--hint);font-size:13px;line-height:1.8}

/* ── STOCK TABLE ── */
.stock-thead,.stock-row{display:grid;grid-template-columns:minmax(80px,1.6fr) 46px minmax(70px,1fr) minmax(80px,1fr) minmax(72px,1fr) 68px 52px;gap:0;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border)}
.stock-thead{padding-bottom:6px}
.stock-row:last-child{border-bottom:none}
.stock-thead>div{font-size:10px;color:var(--muted);text-align:right;line-height:1.4}
.stock-thead>div span{color:var(--hint)}
.stock-thead .scol-name{text-align:left}
.stock-thead .scol-act{text-align:right}
.stock-cn-name{font-size:11px;font-weight:500;color:var(--text);margin-top:2px}
.scol-name{text-align:left}
.scol-shares,.scol-price,.scol-mv,.scol-pnl,.scol-ret{text-align:right}
.scol-act{text-align:right;display:flex;justify-content:flex-end;gap:0}
.scol-main{font-size:12px;font-weight:500;color:var(--text)}
.scol-sub{font-size:10px;color:var(--hint);margin-top:1px}
.scol-shares{font-size:12px;color:var(--text)}
.scol-pnl,.scol-ret{font-size:12px;font-weight:500}
.pending{color:var(--hint);font-size:10px;font-weight:400}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.dark .modal-bg{background:rgba(0,0,0,.6)}
.modal{width:100%;max-width:480px;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:1.25rem 1.25rem calc(1.25rem + var(--safe-bot));max-height:88dvh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 1.25rem}
.modal-title{font-size:16px;font-weight:500;margin-bottom:1.25rem}
.type-toggle{display:flex;gap:4px;background:var(--bg);border-radius:var(--rs);padding:3px;margin-bottom:16px}
.type-btn{flex:1;padding:10px;font-size:14px;font-weight:500;text-align:center;border:none;background:transparent;cursor:pointer;border-radius:6px;font-family:inherit;transition:all .15s;color:var(--muted)}
.type-btn.buy.active{background:rgba(29,158,106,.12);color:var(--green)}
.type-btn.sell.active{background:rgba(208,74,48,.12);color:var(--red)}
.dark .type-btn.buy.active{background:rgba(76,175,130,.18);color:#4caf82}
.dark .type-btn.sell.active{background:rgba(224,108,90,.18);color:#e06c5a}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-cancel{flex:1;padding:12px;background:var(--surface2);color:var(--muted);border:0.5px solid var(--border2);border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit}
.modal-save{flex:2;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.modal-save:disabled{opacity:.5;cursor:not-allowed}

/* ── LOADING / TOAST ── */
.loading-overlay{position:fixed;inset:0;background:rgba(247,246,242,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:999}
.dark .loading-overlay{background:rgba(15,15,15,.85)}
.loading-overlay.show{display:flex}
.spin{display:inline-block;animation:spin .7s linear infinite;font-size:24px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:calc(var(--safe-bot) + 24px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);border-radius:20px;padding:9px 18px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-pad{height:calc(var(--safe-bot) + 24px)}
</style>
</head>
<body>

<!-- AUTH -->
<div class="screen show" id="auth-screen">
  <div class="auth-logo">📊</div>
  <h1 class="auth-title">資產追蹤器</h1>
  <p class="auth-sub">追蹤銀行、股票、加密貨幣，每天自動更新收盤價</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">登入</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">註冊</button>
    </div>
    <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="you@example.com" inputmode="email" autocomplete="email"></div>
    <div class="field"><label>密碼</label><input id="auth-password" type="password" placeholder="至少 6 個字元" autocomplete="current-password"></div>
    <div class="field" id="confirm-field" style="display:none"><label>確認密碼</label><input id="auth-confirm" type="password" placeholder="再輸入一次" autocomplete="new-password"></div>
    <button class="primary-btn" id="auth-btn" onclick="handleAuth()">登入</button>
    <div class="auth-divider">或</div>
    <button class="google-btn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.5 2.8 13.5l7.8 6C12.4 13 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.8 10.5l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.8 6C6.7 42.5 14.7 48 24 48z"/></svg>
      使用 Google 帳號繼續
    </button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="app-screen">
  <div class="statusbar-pad"></div>
  <div class="topnav">
    <span class="app-title">資產追蹤器</span>
    <div class="nav-right">
      <div class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切換主題">☀️</div>
      <div class="icon-btn" onclick="refreshAll()" title="更新報價">↻</div>
      <div class="user-avatar" id="user-avatar" onclick="handleLogout()">?</div>
    </div>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="hero-label">總資產市值</div>
      <div class="hero-total mono" id="hero-total">NT$0</div>
      <div class="hero-row">
        <div class="hero-stat"><div class="hsl">投入成本</div><div class="hsv mono" id="hero-cost">NT$0</div></div>
        <div class="hero-stat"><div class="hsl">未實現損益</div><div class="hsv mono" id="hero-pnl">—</div></div>
        <div class="hero-stat"><div class="hsl">增值佔比</div><div class="hsv mono" id="hero-growth">—</div></div>
      </div>
      <div class="hero-update" id="hero-update">—</div>
      <div class="hero-update" id="fx-display" style="margin-top:2px">匯率載入中…</div>
    </div>

    <!-- DONUT CHART -->
    <div class="donut-card">
      <div class="donut-hdr">資產配置</div>
      <div class="donut-body">
        <div class="donut-wrap">
          <canvas id="donut-chart" width="120" height="120" role="img" aria-label="資產配置圓餅圖"></canvas>
          <div class="donut-center">
            <div class="donut-center-label">總資產</div>
            <div class="donut-center-val" id="donut-total">—</div>
          </div>
        </div>
        <div class="donut-legend" id="donut-legend"></div>
      </div>
    </div>

// 用 TWSE MIS API 批次查詢現價（名稱從 TW_NAMES 取）
async function fetchTWSEBatch(tickers){
  if(!tickers.length) return {};
  const results={};

  // 先用名稱快取填入已知名稱
  tickers.forEach(t=>{if(TW_NAMES[t]) results[t]={price:null,name:TW_NAMES[t]};});

  // MIS API：tse 和 otc 同時查
  const tseList=tickers.map(t=>`tse_${t}.tw`).join('|');
  const otcList=tickers.map(t=>`otc_${t}.tw`).join('|');
  const misUrl=`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(tseList+'|'+otcList)}&json=1&delay=0`;

  const proxies=[
    u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  ];

  for(const proxy of proxies){
    try{
      const res=await fetch(proxy(misUrl),{signal:AbortSignal.timeout(8000)});
      if(!res.ok) continue;
      const text=await res.text();
      if(!text||text.trim().startsWith('<')) continue;
      const data=JSON.parse(text);
      if(!data?.msgArray?.length) continue;

      data.msgArray.forEach(item=>{
        const code=item.c;
        if(!code) return;
        const name=item.n||'';
        const zVal=item.z, yVal=item.y;
        const price=(zVal&&zVal!=='-'&&zVal!=='--')?parseFloat(zVal):
                    (yVal&&yVal!=='-'&&yVal!=='--')?parseFloat(yVal):null;
        const chName=(name&&/[\u4e00-\u9fa5]/.test(name))?name:(TW_NAMES[code]||'');
        if(chName) TW_NAMES[code]=chName;
        if(!results[code]) results[code]={price:null,name:chName};
        else results[code].name=chName||results[code].name;
        if(price&&price>0) results[code].price=parseFloat(price.toFixed(2));
      });
      console.log('MIS API 成功，取得',Object.keys(results).length,'筆');
      break;
    }catch(e){ continue; }
  }
  return results;
}

}

      const upd={updatedAt:new Date().toISOString()};
      if(r.price){s.currentPrice=r.price;upd.currentPrice=r.price;}
      if(hasChName&&(!s.name||!/[\u4e00-\u9fa5]/.test(s.name))){s.name=chName;upd.name=chName;}
      updates.push(updateDoc(userDoc('stocks/'+s.id),upd));
    });
  }

  // 批次查詢所有加密貨幣
  if(cryptos.length){
    const ids=cryptos.map(c=>CRYPTO_ID[c.sym]||c.sym.toLowerCase()).join(',');
    try{
      const res=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
      const json=await res.json();
      cryptos.forEach(c=>{
        const id=CRYPTO_ID[c.sym]||c.sym.toLowerCase();
        const p=json[id]?.usd;
        if(p){c.currentPrice=p;updates.push(updateDoc(userDoc('cryptos/'+c.id),{currentPrice:p,updatedAt:new Date().toISOString()}));}
      });
    }catch(e){}
  }

  await Promise.allSettled(updates);
  document.getElementById('hero-update').textContent='報價更新：'+fmtDate(new Date());
  if(!silent){hideLoad();showToast('報價已更新');renderAll();}
}

// ── SNAPSHOT ────────────────────────────────────────────────
async function maybeAutoSnapshot(){
  const today=new Date().toLocaleDateString('zh-TW');
  if(history.find(h=>h.date===today))return;
  const t=calcTotals();if(t.totalMV===0)return;
  const snap={date:today,totalMV:t.totalMV,totalCost:t.totalCost,stockMV:t.stockMV,bankMV:t.bankMV,cryptoMV:t.cryptoMV,createdAt:new Date().toISOString()};
  try{const ref=await addDoc(userCol('history'),snap);history.push({id:ref.id,...snap});if(history.length>90){const old=history.shift();await deleteDoc(userDoc('history/'+old.id));}}catch(e){}
}

// ── CALC ────────────────────────────────────────────────────
function calcTotals(){
  let stockMV=0,stockCost=0,bankMV=0,cryptoMV=0,cryptoCost=0;
  stocks.forEach(s=>{stockMV+=(s.currentPrice||s.costPrice)*s.shares;stockCost+=s.costPrice*s.shares;});
  banks.forEach(b=>{bankMV+=b.balance*(FX[b.currency]||1);});
  cryptos.forEach(c=>{cryptoMV+=(c.currentPrice||c.costUSD)*c.amount*FX.USD;cryptoCost+=c.costUSD*c.amount*FX.USD;});
  return{stockMV,stockCost,bankMV,cryptoMV,cryptoCost,totalMV:stockMV+bankMV+cryptoMV,totalCost:stockCost+bankMV+cryptoCost};
}

async function saveStockTx(){
  const qty=parseFloat(document.getElementById('modal-shares').value);
  const price=parseFloat(document.getElementById('modal-price').value);
  if(isNaN(qty)||qty<=0||isNaN(price)||price<=0)throw new Error('請填寫股數與價格');
  const s=stocks.find(x=>x.id===modalCtx.id);if(!s)throw new Error('找不到持倉');
  if(modalTxType==='buy'){
    const newShares=s.shares+qty;
    const newCost=(s.shares*s.costPrice+qty*price)/newShares;
    s.shares=newShares;s.costPrice=parseFloat(newCost.toFixed(2));s.currentPrice=price;
    await updateDoc(userDoc('stocks/'+s.id),{shares:s.shares,costPrice:s.costPrice,currentPrice:price,updatedAt:new Date().toISOString()});
    showToast(`買入 ${qty} 股，均成本 $${s.costPrice.toFixed(1)}`);
  }else{
    if(qty>s.shares)throw new Error('賣出股數超過持有');
    s.shares=parseFloat((s.shares-qty).toFixed(4));s.currentPrice=price;
    if(s.shares<=0){await deleteDoc(userDoc('stocks/'+s.id));stocks=stocks.filter(x=>x.id!==s.id);showToast('已全數賣出');}
    else{await updateDoc(userDoc('stocks/'+s.id),{shares:s.shares,currentPrice:price,updatedAt:new Date().toISOString()});showToast(`賣出 ${qty} 股，剩餘 ${s.shares} 股`);}
  }
}
async function saveBankTx(){
  const amount=parseFloat(document.getElementById('modal-bank-amount').value);
  if(isNaN(amount)||amount<=0)throw new Error('請填寫金額');
  const b=banks.find(x=>x.id===modalCtx.id);if(!b)throw new Error('找不到帳戶');
  if(modalTxType==='buy'){b.balance=parseFloat((b.balance+amount).toFixed(2));showToast(`已存入 ${fmt(amount)} ${b.currency}`);}
  else{if(amount>b.balance)throw new Error('提出金額超過餘額');b.balance=parseFloat((b.balance-amount).toFixed(2));showToast(`已提出 ${fmt(amount)} ${b.currency}`);}
  await updateDoc(userDoc('banks/'+b.id),{balance:b.balance,updatedAt:new Date().toISOString()});
}
async function saveCryptoTx(){
  const qty=parseFloat(document.getElementById('modal-crypto-amount').value);
  const price=parseFloat(document.getElementById('modal-crypto-price').value);
  if(isNaN(qty)||qty<=0||isNaN(price)||price<=0)throw new Error('請填寫數量與價格');
  const c=cryptos.find(x=>x.id===modalCtx.id);if(!c)throw new Error('找不到持倉');
  if(modalTxType==='buy'){
    const newAmt=c.amount+qty;const newCost=(c.amount*c.costUSD+qty*price)/newAmt;
    c.amount=parseFloat(newAmt.toFixed(8));c.costUSD=parseFloat(newCost.toFixed(2));c.currentPrice=price;
    await updateDoc(userDoc('cryptos/'+c.id),{amount:c.amount,costUSD:c.costUSD,currentPrice:price,updatedAt:new Date().toISOString()});
    showToast(`買入 ${qty} ${c.sym}，均成本 $${c.costUSD}`);
  }else{
    if(qty>c.amount)throw new Error('賣出數量超過持有');
    c.amount=parseFloat((c.amount-qty).toFixed(8));c.currentPrice=price;
    if(c.amount<=0){await deleteDoc(userDoc('cryptos/'+c.id));cryptos=cryptos.filter(x=>x.id!==c.id);showToast('已全數賣出');}
    else{await updateDoc(userDoc('cryptos/'+c.id),{amount:c.amount,currentPrice:price,updatedAt:new Date().toISOString()});showToast(`賣出 ${qty} ${c.sym}`);}
  }
}

// ── DELETE ───────────────────────────────────────────────────
window.delStock=async(id)=>{const s=stocks.find(x=>x.id===id);if(!confirm('確定刪除 '+(s?.ticker||'')+'？'))return;await deleteDoc(userDoc('stocks/'+id));stocks=stocks.filter(x=>x.id!==id);renderAll();};
window.delBank=async(id)=>{const b=banks.find(x=>x.id===id);if(!confirm('確定刪除 '+(b?.name||'')+'？'))return;await deleteDoc(userDoc('banks/'+id));banks=banks.filter(x=>x.id!==id);renderAll();};
window.delCrypto=async(id)=>{const c=cryptos.find(x=>x.id===id);if(!confirm('確定刪除 '+(c?.sym||'')+'？'))return;await deleteDoc(userDoc('cryptos/'+id));cryptos=cryptos.filter(x=>x.id!==id);renderAll();};

// ── TAB & REFRESH ────────────────────────────────────────────
window.refreshAll=async()=>{await loadFXRates();await refreshPrices(false);await maybeAutoSnapshot();};
window.switchTab=(t)=>{
  ['bank','stock','crypto'].forEach((s,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',s===t);
    document.getElementById('panel-'+s).classList.toggle('active',s===t);
  });
};

if(navigator.serviceWorker)navigator.serviceWorker.register('./sw.js').catch(()=>{});
